[package]
name = "bip"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.43.0", features = ["chat-completion", "rustls"], default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
json-patch = "5.0.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
