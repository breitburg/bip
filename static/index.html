<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bip</title>
<style>
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
form { display: flex; gap: 8px; }
input { flex: 1; }
</style>
</head>
<body>
<p id="status">connecting...</p>
<div id="messages"></div>
<form id="form">
<select id="target" title="The agent that Send and Stop are for"><option>main</option></select>
<input id="input" autocomplete="off" autofocus>
<button>Send</button>
<button type="button" id="stop">Stop</button>
<button type="button" id="reset">Reset</button>
</form>
<script>
const status = document.getElementById("status");
const list = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const reset = document.getElementById("reset");
const stop = document.getElementById("stop");
const target = document.getElementById("target");

// Each agent's context, by agent name, rebuilt from the JSON Patches Bip
// streams. `main` is the primary agent; subagents are named by short IDs,
// like `4C1D7A`.
let agents;

// Apply one JSON Patch (RFC 6902) operation to `state`. Bip only sends add,
// remove and replace.
function apply(state, op) {
  const keys = op.path.split("/").slice(1).map((k) => k.replaceAll("~1", "/").replaceAll("~0", "~"));
  const last = keys.pop();
  let parent = state;
  for (const key of keys) parent = parent[key];
  if (op.op === "remove") {
    Array.isArray(parent) ? parent.splice(Number(last), 1) : delete parent[last];
  } else if (op.op === "add" && Array.isArray(parent)) {
    parent.splice(last === "-" ? parent.length : Number(last), 0, op.value);
  } else {
    parent[last] = op.value;
  }
}

// Offer every running agent as a target, keeping the choice while it runs.
function renderTargets() {
  const names = ["main", ...Object.keys(agents).filter((a) => a !== "main")];
  const chosen = names.includes(target.value) ? target.value : "main";
  target.replaceChildren(...names.map((name) => new Option(name, name)));
  target.value = chosen;
}

function render() {
  renderTargets();
  list.innerHTML = "";
  for (const [agent, state] of Object.entries(agents)) {
    const heading = document.createElement("h3");
    heading.textContent = agent;
    list.appendChild(heading);
    for (const id of state.order) {
      const m = state.messages[id];
      const role = m.role.agent ? `from ${m.role.agent}` : m.role;
      let text = `[${m.id}] ${role}\n${m.content}`;
      for (const call of m.tool_calls) {
        text += `\n-> ${call.name}(${call.arguments})`;
        if (call.result !== null) text += `\n<- ${call.result}`;
      }
      const pre = document.createElement("pre");
      pre.textContent = text;
      list.appendChild(pre);
    }
  }
}

// Patches arrive far faster than the screen redraws, so render at most once
// per frame.
let scheduled = false;
function scheduleRender() {
  if (scheduled) return;
  scheduled = true;
  requestAnimationFrame(() => {
    scheduled = false;
    render();
  });
}

let socket;
function send(input) {
  if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(input));
}
form.onsubmit = (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  send({ type: "message", data: { text, agent: target.value } });
  input.value = "";
};
reset.onclick = () => send({ type: "reset" });
stop.onclick = () => send({ type: "stop", data: { agent: target.value } });

function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onopen = () => {
    // Bip replays every change to each new connection, so start empty.
    agents = {};
    status.textContent = "connected";
  };
  socket.onclose = () => {
    status.textContent = "disconnected, retrying...";
    setTimeout(connect, 1000);
  };
  socket.onmessage = (event) => {
    const output = JSON.parse(event.data);
    if (output.type === "change") {
      const { agent, patch } = output.data;
      agents[agent] ??= { messages: {}, order: [] };
      for (const op of patch) apply(agents[agent], op);
      scheduleRender();
    } else if (output.type === "finished") {
      delete agents[output.data.agent];
      scheduleRender();
    } else if (output.type === "reset") {
      agents = {};
      scheduleRender();
    } else if (output.type === "error") {
      status.textContent = `error in ${output.data.agent}: ${output.data.message}`;
    }
  };
}
connect();
</script>
</body>
</html>
